[project]
name = "video-onlinehmr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11.5"
dependencies = [
    "chumpy",
    "detectron2",
    "deva",
    "gdown>=6.4.2",
    "glfw==2.10.0",
    "hydra-core==1.3.2",
    "in3d",
    "iopath==0.1.9",
    "loguru==0.7.3",
    "manifold3d==3.2.1",
    "mapbox-earcut==1.0.3",
    "mast3r",
    "mast3r-slam",
    "matplotlib==3.10.6",
    "matplotlib-inline==0.1.7",
    "moderngl==5.12.0",
    "moderngl-window==2.4.6",
    "moge",
    "multipledispatch==1.0.0",
    "numexpr==2.12.1",
    "omegaconf==2.3.0",
    "open3d==0.18.0",
    "opencv-python>=4.11.0.86",
    "pandas==2.3.2",
    "pip>=26.2.1",
    "pybind11>=3.1.0",
    "pycocotools==2.0.10",
    "pyglet==2.1.8",
    "pygments==2.19.2",
    "pyrr==0.10.3",
    "pytorch-minimize>=0.1.0",
    "pytorch3d",
    "pyyaml==6.0.2",
    "requests==2.32.5",
    "scikit-image==0.25.2",
    "scikit-learn==1.7.2",
    "seaborn==0.13.2",
    "segment-anything>=1.0",
    "smplx==0.1.28",
    "tabulate==0.9.0",
    "termcolor==3.1.0",
    "timm==1.0.20",
    "torch==2.5.1",
    "torchaudio==2.5.1",
    "torchcodec==0.1",
    "torchvision==0.20.1",
    "tqdm==4.67.1",
    "trimesh==4.8.2",
    "viser>=1.1.1",
    "yacs==0.1.8",
]

[tool.uv.sources]
chumpy = { git = "https://github.com/mattloper/chumpy.git" }
mast3r = { workspace = true, editable = true }
in3d = { workspace = true }
mast3r-slam = { workspace = true, editable = true }
detectron2 = { git = "https://github.com/facebookresearch/detectron2.git", rev = "a59f05630a8f205756064244bf5beb8661f96180" }
pytorch3d = { git = "https://github.com/facebookresearch/pytorch3d.git", rev = "stable" }
deva = { workspace = true, editable = true }
moge = { git = "https://github.com/microsoft/MoGe.git", rev = "b942f00bdc2a2a23ebb474fbe034d487e6dcceec" }

[tool.uv.workspace]
members = [
    "thirdparty/MASt3R-SLAM/thirdparty/mast3r",
    "thirdparty/MASt3R-SLAM/thirdparty/in3d",
    "thirdparty/MASt3R-SLAM",
    "thirdparty/Tracking-Anything-with-DEVA",
]

[tool.uv]
no-build-isolation-package = ["chumpy", "mast3r", "mast3r-slam", "detectron2", "pytorch3d"]
